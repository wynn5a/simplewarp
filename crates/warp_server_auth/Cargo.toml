[package]
name = "warp_server_auth"
version = "0.1.0"
edition = "2024"
authors.workspace = true
publish.workspace = true
license.workspace = true

[features]
agent_mode_evals = ["dep:rand"]
integration_tests = []
# A build with no Warp account behind it: never adopt a user (test, env-var, or persisted) and
# never obtain a token. Distinct from `skip_login`, which installs a stand-in test user so the
# app still believes it is logged in.
local_only = []
skip_login = []
test-util = []

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
async-trait.workspace = true
chrono.workspace = true
cynic.workspace = true
http_client.workspace = true
instant.workspace = true
lasso.workspace = true
log.workspace = true
parking_lot.workspace = true
rand = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
warp_core.workspace = true
warp_errors.workspace = true
warp_graphql.workspace = true
warpui_core.workspace = true
warpui_extras = { workspace = true, features = ["default"] }

[dev-dependencies]
futures.workspace = true
