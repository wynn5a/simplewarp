[package]
name = "warp_core"
edition = "2024"
authors = ["Warp Team <dev@warp.dev>"]
publish.workspace = true
license.workspace = true

# False positives: used through `define_settings_group!` and derive expansions.
[package.metadata.cargo-machete]
ignored = ["concat-idents", "strum"]

[features]
integration_tests = []
test-util = ["warp_features/test-util"]

[dependencies]
anyhow.workspace = true
cfg-if.workspace = true
command-corrections.workspace = true
concat-idents.workspace = true
dirs.workspace = true
directories.workspace = true
futures-lite.workspace = true
warp_errors.workspace = true
warp_features.workspace = true
itertools.workspace = true
getset.workspace = true
lazy_static.workspace = true
log.workspace = true
parking_lot.workspace = true
pin-project.workspace = true
serde.workspace = true
settings.workspace = true
serde_json.workspace = true
serde_with.workspace = true
strum.workspace = true
strum_macros.workspace = true
thiserror.workspace = true
tracing.workspace = true
regex.workspace = true
instant.workspace = true
schemars = "1"
settings_value = { workspace = true, features = ["derive"] }
async-broadcast.workspace = true
futures.workspace = true
line-ending.workspace = true
warpui_core.workspace = true
warpui_extras = { workspace = true, features = ["default"] }
string-offset.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { workspace = true, features = [
    "NSString",
    "NSURL",
    "NSFileManager",
    "NSBundle",
] }
tempfile.workspace = true

[dev-dependencies]
rand.workspace = true
serde_yaml.workspace = true
