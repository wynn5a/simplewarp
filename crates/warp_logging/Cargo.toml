[package]
name = "warp_logging"
edition = "2024"
description = "Warp logging configuration"
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
cfg-if.workspace = true
env_logger.workspace = true
log.workspace = true
warp_core.workspace = true
warp_errors.workspace = true
dirs.workspace = true
log-panics = { version = "2.1.0", features = ["with-backtrace"] }
zip = "2.1"

# Optional crash reporting integration.
sentry = { workspace = true, optional = true }
sentry-log = { workspace = true, optional = true }

[features]
crash_reporting = ["dep:sentry", "dep:sentry-log", "warp_errors/crash_reporting"]
agent_mode_evals = []
[dev-dependencies]
tempfile.workspace = true

