identifier = "dev.simplewarp.SimpleWarp"
name = "SimpleWarp"
icon = ["channels/stable/icon/no-padding/512x512.png", "channels/stable/icon/no-padding/icon.ico"]
short_description = "A local-only terminal with bring-your-own-key AI."

