[package]
authors = ["Warp Team <dev@warp.dev>"]
default-run = "simplewarp"
description = "A local-only terminal with bring-your-own-key AI"
edition = "2024"
autobins = false
name = "warp"
version = "0.1.0"
publish.workspace = true
license.workspace = true

# False positives: used through macro/derive expansions, serde attribute paths and a re-export.
[package.metadata.cargo-machete]
ignored = ["asset_cache", "concat-idents", "serde_bytes", "serde_regex"]

[lib]
name = "warp"
path = "src/lib.rs"

# Each app binary sets its own channel config (app id, log file, flag overrides) and bundles with
# its own app name and icon; otherwise they are identical.

[[bin]]
name = "simplewarp"
path = "src/bin/simplewarp.rs"
test = false

[[bin]]
name = "integration"
path = "src/bin/integration.rs"
test = false

[[bin]]
name = "generate_settings_schema"
path = "src/bin/generate_settings_schema.rs"
test = false

[dependencies]
addr = "0.15.6"
