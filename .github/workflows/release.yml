name: Release

on:
  push:
    tags:
      - 'v*'
    # Builds on master only warm the Rust cache: caches saved from a tag ref are not
    # reusable by other tags, but every ref can restore the ones saved from master.
    branches:
      - master
    paths:
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/release.yml
      - .github/actions/prepare_environment/action.yml
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0); required when dispatching from a branch'
        required: false
        type: string
      dry_run:
        description: 'Build artifacts only, do not create a release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: Build macOS (aarch64)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/prepare_environment
        with:
          target_os: macos
          is_self_hosted: 'false'
          install_release_deps: 'true'
      - name: Determine version
        id: version
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build SimpleWarp.app
        shell: bash
        env:
          SIMPLEWARP_VERSION: ${{ steps.version.outputs.version }}
        run: script/bundle_simplewarp
      - name: Zip app bundle
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent target/release/SimpleWarp.app \
            "SimpleWarp-${{ steps.version.outputs.version }}-macos-aarch64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: SimpleWarp-*-macos-aarch64.zip
          if-no-files-found: error

  linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/prepare_environment
        with:
          target_os: linux
          is_self_hosted: 'false'
          install_release_deps: 'true'
      - name: Determine version
        id: version
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build
        shell: bash
        run: cargo build --release --bin simplewarp
      - name: Prepare bundled resources
        shell: bash
        run: script/prepare_bundled_resources dist/simplewarp/resources release
      - name: Package
        shell: bash
        run: |
          strip target/release/simplewarp
          cp target/release/simplewarp dist/simplewarp/
          tar -czf "SimpleWarp-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz" -C dist simplewarp
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: SimpleWarp-*-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/prepare_environment
        with:
          target_os: windows
          is_self_hosted: 'false'
          install_release_deps: 'true'
      - name: Determine version
        id: version
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build
        shell: bash
        env:
          CARGO_BIN_NAME: stable
          WARP_APP_NAME: SimpleWarp
          GIT_RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: cargo build --release --bin simplewarp
      - name: Prepare bundled resources
        shell: bash
        # Same env as the build, so the settings-schema generator reuses its artifacts.
        env:
          CARGO_BIN_NAME: stable
          WARP_APP_NAME: SimpleWarp
          GIT_RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: script/prepare_bundled_resources dist/simplewarp/resources release
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          Copy-Item target/release/simplewarp.exe dist/simplewarp/
          Compress-Archive -Path dist/simplewarp -DestinationPath "SimpleWarp-$v-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: SimpleWarp-*-windows-x86_64.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' || (github.ref_type != 'tag' && github.event.inputs.tag == '') }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        shell: bash
        run: ls -la dist/
      - name: Validate tag
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          if [[ "$TAG" != v* ]]; then
            echo "::error::Refusing to release: '$TAG' is not a v-prefixed tag. Pass the 'tag' input or push a tag."
            exit 1
          fi
      - name: Create or update release
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "SimpleWarp $TAG" --generate-notes
          fi
